name: Linux System Health Monitoring CI

on:
  push:
  pull_request:

jobs:
  system-monitoring:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 11-cicd-devops/01-github-actions-linux-monitoring

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash script
        run: bash -n scripts/system_health.sh

      - name: Execute system health monitoring
        run: bash scripts/system_health.sh
